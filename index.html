
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIHUU</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button {
    padding: 22px 55px;
    border: none;
    border-radius: 15px;
    background: #ffffff;
    color: #764ba2;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}

button:active {
    transform: scale(0.95);
}

#hasil {
    display: none;
    color: white;
    font-size: 65px;
    font-weight: bold;
    text-align: center;
    animation: muncul 0.7s ease;
}

@keyframes muncul {
    0% {
        opacity: 0;
        transform: scale(0.3);
    }
    70% {
        opacity: 1;
        transform: scale(1.2);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<button id="tombol" onclick="pencet()">PENCET</button>

<div id="hasil">HIHUU!!</div>

<audio id="suara" src="fixx (mp3cut.net).mp3"></audio>

<script>
function pencet() {
    // Hilangkan tombol
    document.getElementById("tombol").style.display = "none";

    // Tampilkan tulisan
    document.getElementById("hasil").style.display = "block";

    // Putar suara
    const suara = document.getElementById("suara");
    suara.currentTime = 0;
    suara.play();
}
</script>

</body>
</html>
